spring:
  application:
    name: smart-lead-qualification
  devtools:
    add-properties: false
  datasource:
    url: jdbc:postgresql://localhost:8089/postgres
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect



huggingface:
  api-key: ${HUGGINGFACE_API_KEY}
  model: meta-llama/Llama-3.3-70B-Instruct